        summary: "Mentors: Professor Vikram Gavini and Professor Xun Huan"
        highlights:
          - Developing data-driven digital twin algorithms for rotator cuff tendons that integrate full volume experimental data with computational modeling to predict injuries and optimize repair strategies
          - Collaborating on a diffusion algorithm to discover hourglass geometry from stress fields (with Professor Talia Moore) and on phase field inference for anisotropic soft materials (with Professor Jacinto Ulloa)
          - Built a predictive model for alcohol use disorder with uncertainty quantification (with Professor Dimah Dera and Professor Chenlan Wang)

