        position: Doctoral Researcher
        location: Ann Arbor, MI
        start_date: 2020
        end_date: 2025
        highlights:
          - Established an MRI-based experimental–computational framework to study rotator cuff tear progression, combining imaging, solid mechanics, and data-driven system identification
          - Created scalable computational pipelines to infer parsimonious constitutive behavior in the rotator cuff
          - Pioneered 3D strain measurement and 3D inverse modeling algorithms in the rotator cuff
          - Designed an adjustable experimental setup for strength measurement of repaired tendon–bone complexes

      - company: University of Michigan
